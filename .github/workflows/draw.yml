name: cation-draw

# Runs the Cation draw keeper on a schedule. The keeper no-ops until the on-chain
# draw window is open, so running every few hours is safe for a daily interval.
on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install keeper deps
        # --install-links so the file: bindings dep is installed as a real
        # package with its own deps (@stellar/stellar-sdk), not a bare symlink
        # whose imports fail to resolve in CI.
        run: cd keeper && npm install --install-links
      - name: Run draw
        run: cd keeper && npm run draw
        env:
          POOL_ID: ${{ secrets.POOL_ID }}
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
