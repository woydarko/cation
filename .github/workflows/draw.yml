name: cation-draw

# Runs the Cation draw keeper. The contract gates the draw on ledger close time
# at the next 00:00 UTC boundary, so the draw fires daily at midnight UTC. The
# keeper no-ops until then. GitHub's scheduled runs are often delayed by minutes
# and occasionally skipped, so we fire a few times in the first UTC hours; the
# first run at/after 00:00 draws and the rest no-op.
on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC (the draw)
    - cron: "20 0 * * *" # retry if the 00:00 run was delayed/skipped
    - cron: "0 1 * * *" # retry
    - cron: "0 3 * * *" # last-resort catch-up
  workflow_dispatch: {} # allow manual runs

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install keeper deps
        # --install-links so the file: bindings dep is installed as a real
        # package with its own deps (@stellar/stellar-sdk), not a bare symlink
        # whose imports fail to resolve in CI.
        run: cd keeper && npm install --install-links
      - name: Run draw
        run: cd keeper && npm run draw
        env:
          POOL_ID: ${{ secrets.POOL_ID }}
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
