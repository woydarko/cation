name: cation-draw

# Runs the Cation draw keeper on a schedule. The draw window is ledger-based
# (next_draw_ledger = last draw + draw_interval), so it drifts against wall-clock
# time and does not line up with a fixed hour. The keeper no-ops until the window
# is open, so we run every 2 hours and it fires the draw within a couple of hours
# of each ~daily window opening.
on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch: {} # allow manual runs

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install keeper deps
        # --install-links so the file: bindings dep is installed as a real
        # package with its own deps (@stellar/stellar-sdk), not a bare symlink
        # whose imports fail to resolve in CI.
        run: cd keeper && npm install --install-links
      - name: Run draw
        run: cd keeper && npm run draw
        env:
          POOL_ID: ${{ secrets.POOL_ID }}
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
