name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  contract:
    name: smart contract (fmt / clippy / test / wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt -p prize-pool --check
      - name: clippy
        run: cargo clippy -p prize-pool --all-targets
      - name: test
        run: cargo test -p prize-pool
      - uses: cargo-bins/cargo-binstall@main
      - name: install stellar cli
        run: cargo binstall -y stellar-cli
      - name: contract build (stellar cli)
        run: stellar contract build

  web:
    name: frontend (install / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm install
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
